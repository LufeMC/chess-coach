name: ChessCoach

options:
  bundleIdPrefix: com.usenivel
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: QKFMZUC59Z
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ChessKit:
    path: Packages/ChessKit
  EngineKit:
    path: Packages/EngineKit
  Database:
    path: Packages/Database
  AnalysisKit:
    path: Packages/AnalysisKit
  BoardUI:
    path: Packages/BoardUI
  TrainingCore:
    path: Packages/TrainingCore
  ClaudeKit:
    path: Packages/ClaudeKit

targets:
  ChessCoach:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: App
        excludes:
          - "Resources/Networks/**"
          - "Resources/puzzles.sqlite"
      # Large binary assets are declared as resources explicitly. The small NNUE
      # net and the curated puzzle DB must be in the bundle: the engine cannot
      # search without a network, and the puzzle DB is read-only reference data.
      # Both nets are bundled. The big one is 71MB, which the plan originally
      # wanted to download on first run — but Stockfish runs in-process and
      # calls exit() when a net is missing, so a failed or pending download
      # would take the whole app down rather than degrading. For a personally
      # installed app the size is a fair trade for that robustness.
      - path: App/Resources/Networks/nn-37f18f62d772.nnue
        buildPhase: resources
        optional: true
      - path: App/Resources/Networks/nn-1c0000000000.nnue
        buildPhase: resources
        optional: true
      - path: App/Resources/puzzles.sqlite
        buildPhase: resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChessCoach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # CloudKit pushes silent notifications to tell a device its records
        # changed. Without this background mode the sync engine only catches up
        # when the app is next foregrounded, which for an iPhone/Mac pair means
        # analysis done on one device shows up on the other minutes late.
        UIBackgroundModes:
          - remote-notification
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/ChessCoach.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.usenivel.chesscoach
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usenivel.chesscoach
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # Stockfish is C++; the app target links it through EngineKit.
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    dependencies:
      - package: ChessKit
        product: ChessKit
      - package: EngineKit
        product: EngineKit
      - package: Database
        product: Database
      - package: AnalysisKit
        product: AnalysisKit
      - package: BoardUI
        product: BoardUI
      - package: TrainingCore
        product: TrainingCore
      - package: ClaudeKit
        product: ClaudeKit

  ChessCoachTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: AppTests
    dependencies:
      - target: ChessCoach
    settings:
      base:
        # Host the tests in the app so anything touching the Keychain or the
        # bundled resources runs with the app's identity rather than the test
        # runner's. Without a host, Keychain calls fail with
        # errSecMissingEntitlement and bundle lookups return nil.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChessCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChessCoach"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
