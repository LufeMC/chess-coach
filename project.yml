name: ChessCoach

options:
  bundleIdPrefix: com.usenivel
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: QKFMZUC59Z
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2026082004"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ChessKit:
    path: Packages/ChessKit
  EngineKit:
    path: Packages/EngineKit
  Database:
    path: Packages/Database
  AnalysisKit:
    path: Packages/AnalysisKit
  BoardUI:
    path: Packages/BoardUI
  TrainingCore:
    path: Packages/TrainingCore

targets:
  ChessCoach:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: App
        excludes:
          - "Resources/Networks/**"
          - "Resources/puzzles.sqlite"
      # Large binary assets are declared as resources explicitly. The small NNUE
      # net and the curated puzzle DB must be in the bundle: the engine cannot
      # search without a network, and the puzzle DB is read-only reference data.
      # Both nets are bundled. The big one is 71MB, which the plan originally
      # wanted to download on first run — but Stockfish runs in-process and
      # calls exit() when a net is missing, so a failed or pending download
      # would take the whole app down rather than degrading. For a personally
      # installed app the size is a fair trade for that robustness.
      - path: App/Resources/Networks/nn-37f18f62d772.nnue
        buildPhase: resources
        optional: true
      - path: App/Resources/Networks/nn-1c0000000000.nnue
        buildPhase: resources
        optional: true
      - path: App/Resources/puzzles.sqlite
        buildPhase: resources
        optional: true
      # Declared explicitly so it lands in the bundle root, which is the only
      # place the App Store scanner looks for it.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rookly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Rookly is free software under the GNU GPL v3. Embeds Stockfish (GPL v3) and ChessKit (MIT). Source and notices: Settings › Acknowledgements."
        # No UIBackgroundModes. CloudKit's silent-notification wake-up is the
        # only one this app would want, and sync is off (UserDatabase.sync
        # (enabled: false)) — declaring a background mode the app never uses is
        # dead weight and an App Review question with no good answer. Re-add
        # `remote-notification` here and `aps-environment` below in the same
        # commit that turns sync on, never before.
    # No entitlements file. The app claims no capability it does not use.
    #
    # iCloud/CloudKit used to be declared here so the container identifier was
    # pinned for a future sync feature, but an entitlement is a claim reviewed
    # against behaviour, not a bookmark: `UserDatabase.sync(enabled: false)`
    # means the app never opens a CloudKit container, and "we declared it for
    # later" is the answer to an App Review question that has no good version.
    #
    # The identifier it would adopt is recorded in Docs/licensing.md and in the
    # schema notes instead, which is where a decision belongs. Turning sync on
    # means re-adding these three keys, `remote-notification` under
    # UIBackgroundModes, and `aps-environment` — all in the same commit:
    #
    #   com.apple.developer.icloud-container-identifiers:
    #     - iCloud.com.usenivel.chesscoach
    #   com.apple.developer.icloud-services: [CloudKit]
    #   com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    preBuildScripts:
      # Fails with the command to run, instead of three "no such file" errors
      # from the resource-copy phase naming files a newcomer has no reason to
      # recognise. The assets are deliberately not in git (71MB, and a derived
      # database), so a fresh clone hitting this is the normal path, not a
      # broken checkout — and this is the one place that can say so.
      - name: Check generated assets
        basedOnDependencyAnalysis: false
        script: |
          missing=0
          for net in nn-37f18f62d772 nn-1c0000000000; do
            if [ ! -f "$SRCROOT/App/Resources/Networks/$net.nnue" ]; then
              echo "error: missing $net.nnue — run ./Scripts/fetch-nnue.sh"
              missing=1
            fi
          done
          if [ ! -f "$SRCROOT/App/Resources/puzzles.sqlite" ]; then
            echo "error: missing puzzles.sqlite — see README.md step 2 (Tools/PuzzlePrep)"
            missing=1
          fi
          exit $missing

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usenivel.chesscoach
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # iPhone only. The layout is a TabView tuned for one hand at 390pt and
        # the board sizes itself from the space below a phone safe area; iPad
        # would get that stretched across 1024pt, which is not a design anyone
        # has done. Shipping 1,2 would promise a device family that has never
        # been opened.
        TARGETED_DEVICE_FAMILY: "1"
        # Stockfish is C++; the app target links it through EngineKit.
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    dependencies:
      - package: ChessKit
        product: ChessKit
      - package: EngineKit
        product: EngineKit
      - package: Database
        product: Database
      - package: AnalysisKit
        product: AnalysisKit
      - package: BoardUI
        product: BoardUI
      - package: TrainingCore
        product: TrainingCore

  ChessCoachTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: AppTests
    dependencies:
      - target: ChessCoach
    settings:
      base:
        # Host the tests in the app so `Bundle.main` resolves to the app
        # rather than the test runner. Without a host the NNUE nets, the
        # puzzle DB and the move sounds all come back nil, and the failures
        # land in tests that have nothing to do with resource loading.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChessCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChessCoach"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
